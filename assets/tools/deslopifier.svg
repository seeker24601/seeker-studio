<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#1c1a17"/>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="2">
<text x="70" y="90" fill="#a39d90">DRAFT</text>
<text x="730" y="90" fill="#ff5a2e" text-anchor="end">3 FLAGGED</text>
</g>
<path d="M70 110h660" stroke="#3a362f"/>
<g font-family="Georgia,serif" font-size="30" fill="#eeeae0">
<rect x="64" y="136" width="318" height="42" rx="4" fill="#ff5a2e" fill-opacity=".14"/>
<text x="70" y="167" fill="#a39d90" textLength="306" lengthAdjust="spacingAndGlyphs">It’s worth noting that</text>
<text x="394" y="167" textLength="152" lengthAdjust="spacingAndGlyphs">the release</text>
<rect x="64" y="190" width="416" height="42" rx="4" fill="#ff5a2e" fill-opacity=".14"/>
<text x="70" y="221" fill="#a39d90" textLength="404" lengthAdjust="spacingAndGlyphs">delves into a rich tapestry</text>
<text x="492" y="221" textLength="150" lengthAdjust="spacingAndGlyphs">of fixes for</text>
<text x="70" y="275" textLength="224" lengthAdjust="spacingAndGlyphs">the sync engine.</text>
</g>
<g stroke="#ff5a2e" stroke-width="2.5"><path d="M68 157h310"/><path d="M68 211h408"/></g>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="2">
<text x="70" y="346" fill="#eeeae0">REWRITE</text>
</g>
<path d="M70 366h660" stroke="#3a362f"/>
<rect x="70" y="386" width="4" height="84" fill="#eeeae0"/>
<g font-family="Georgia,serif" font-size="30" fill="#eeeae0">
<text x="92" y="420" textLength="290" lengthAdjust="spacingAndGlyphs">The release fixes</text>
<text x="92" y="462" textLength="330" lengthAdjust="spacingAndGlyphs">sync engine bugs.</text>
</g>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#a39d90">
<text x="70" y="530"><tspan fill="#eeeae0">✓</tspan> meaning kept</text>
<text x="290" y="530"><tspan fill="#eeeae0">✓</tspan> quotes untouched</text>
<text x="540" y="530"><tspan fill="#eeeae0">✓</tspan> no new flags</text>
</g>
</svg>
