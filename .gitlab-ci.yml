# Publish the site with GitLab Pages. The site is static, so the job only copies files.
pages:
  image: alpine:3.20
  stage: deploy
  script:
    - mkdir public
    - cp -r $(ls -A | grep -vxE 'public|\.git|\.gitlab-ci\.yml|AGENTS\.md|README\.md|CNAME') public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
