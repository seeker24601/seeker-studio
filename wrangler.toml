# Cloudflare serves the site as static files. Deploy with `npx wrangler deploy` from this folder;
# the build step copies the public files into dist/ first.
name = "seeker-studio"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [
  { pattern = "seeker-studio.games", custom_domain = true },
  { pattern = "www.seeker-studio.games", custom_domain = true },
]

[build]
command = "node scripts/build-site.mjs"

[assets]
directory = "./dist"
